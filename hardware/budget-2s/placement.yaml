# Budget-2S board (DD-38): 90 x 60 mm, 4 layers, single-sided assembly. Coordinates are mm from the
# board centre, +y down, viewed from the top. Power flows left to right along the upper half
# (J1 -> F1 -> Q1 -> U1 -> L1 -> output caps -> RS1 -> Q2 -> J2); control logic is in the lower half.
# High-current nets are F.Cu pours (zones_pre); router keep-outs protect their cores. Kelvin sense
# traces are pre-routed from the inner edges of the shunt pads: INA186 (U2) below, INA300 (U3) above,
# each with its own pair. CAD work-in-progress; physical validation remains open.
board:
  outline: {type: rectangle, w: 90.0, h: 60.0}
  copper_layers: 4
  thickness: 1.6
placement_box: [-44.0, -29.0, 44.0, 29.0]
courtyard_gap: 0.10

parts:
