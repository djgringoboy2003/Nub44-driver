# Kelvin sense traces (pre-routed, F.Cu) and the BOOT strap.
tracks:
  # INA186 VBUCK sense leaves pad 1 on F.Cu, crosses on B.Cu, and enters U2 IN+ from the right so U2's
  # supply/ground pins are not enclosed.
  - {net: VBUCK, kelvin: U2, layer: F.Cu, width: 0.2, pts: [[33.4, -8.45], [33.4, -7.6]]}
  - {net: VBUCK, kelvin: U2, layer: B.Cu, width: 0.2, pts: [[33.4, -7.6], [37.9, -4.3]]}
  - {net: VBUCK, kelvin: U2, layer: F.Cu, width: 0.2, pts: [[37.9, -4.3], [37.25, -4.95], [36.84, -4.95]]}
  - {net: VSH, kelvin: U2, layer: F.Cu, width: 0.2, pts: [[38.6, -8.45], [38.6, -5.6], [36.84, -5.6]]}
  - {net: VBUCK, kelvin: U3, layer: F.Cu, width: 0.2, pts: [[33.4, -11.6], [33.4, -12.6], [37.4, -12.6], [38.1, -13.4]]}
  - {net: VSH, kelvin: U3, layer: F.Cu, width: 0.2, pts: [[38.6, -11.6], [39.4, -12.4], [39.4, -13.9], [38.1, -13.9]]}
  # Q2 gate network: R8/D3 VSH side straight into the VSH pour, gate side to Q2 pin 4 (router adds R9)
