  H1: {pos: [-41.0, -26.0, 0], side: F, both_sides: true}
  H2: {pos: [41.0, -26.0, 0], side: F, both_sides: true}
  H3: {pos: [41.0, 26.0, 0], side: F, both_sides: true}
  H4: {pos: [-41.0, 26.0, 0], side: F, both_sides: true}
  # ---- automatic placement near each part's net partners
  R1: {auto: {anchor: [-3.5, -15.0], side: F}}
