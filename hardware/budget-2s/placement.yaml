  J1: {pos: [-31.0, -16.0, 90], side: F, both_sides: true}
  F1: {pos: [-24.5, -12.7, 0], side: F, both_sides: true}
  Q1: {pos: [-7.4, -11.0, 180], side: F}
  C3: {pos: [-2.0, -10.3, 90], side: F}
  C2: {pos: [0.4, -10.3, 90], side: F}
  U1: {pos: [4.0, -10.0, 0], side: F}
