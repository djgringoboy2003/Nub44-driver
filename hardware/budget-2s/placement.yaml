  - {net: VSH, layer: F.Cu, width: 0.25, pts: [[41.1, -7.0], [39.45, -7.0]]}
  - {net: QOUT_G, layer: F.Cu, width: 0.2, pts: [[39.45, -5.55], [41.1, -5.55]]}
  - {net: QOUT_G, layer: F.Cu, width: 0.15, pts: [[41.1, -5.6], [41.7, -6.2], [41.7, -8.55], [41.3, -9.0]]}
  - {net: BOOT, layer: F.Cu, width: 0.25, pts: [[5.65, -11.0], [6.3, -11.0], [6.3, -12.7], [5.82, -13.4]]}
  # Input-loop return, solid copper instead of pour spokes: C3/C2 GND pads -> U1 GND pins 2-3 -> exposed pad
  - {net: GND, layer: F.Cu, width: 1.0, pts: [[-2.0, -11.775], [1.6, -11.775]]}
  - {net: GND, layer: F.Cu, width: 0.4, pts: [[1.6, -11.775], [2.35, -11.2], [2.35, -10.6]]}
  - {net: GND, layer: F.Cu, width: 0.4, pts: [[2.35, -10.75], [3.1, -10.75]]}
  # U1 small-signal escapes beside the exposed-pad fingers; the router continues from their ends.
  - {net: RT, layer: F.Cu, width: 0.15, pts: [[3.25, -11.65], [3.25, -12.8], [2.44, -13.61], [2.44, -15.19]]}  # to R2
  - {net: PWRGD, layer: F.Cu, width: 0.15, pts: [[4.75, -11.65], [4.75, -13.4]]}
  - {net: VSENSE, layer: F.Cu, width: 0.15, pts: [[3.25, -8.35], [3.25, -6.5]]}            # to R5 pad 2
  - {net: VSENSE, layer: F.Cu, width: 0.15, pts: [[3.25, -6.425], [2.45, -6.425], [2.45, -2.9], [3.225, -2.9]]}  # R6
  - {net: COMP, layer: F.Cu, width: 0.15, pts: [[4.75, -8.35], [4.75, -7.0]]}              # to R3 pad 1
  - {net: COMP, layer: F.Cu, width: 0.15, pts: [[4.85, -6.825], [5.6, -6.825], [5.85, -6.575], [5.85, -4.6],
                                                 [6.25, -4.2], [6.95, -4.2]]}             # C9
  - {net: COMP_RC, layer: F.Cu, width: 0.2, pts: [[4.85, -5.175], [4.85, -3.675]]}          # R3 to C8
  - {net: SS, layer: F.Cu, width: 0.15, pts: [[5.65, -9.0], [6.35, -9.0], [6.95, -8.4], [6.95, -7.3]]}  # C6
  - {net: EN, layer: F.Cu, width: 0.15, pts: [[5.65, -9.5], [7.4, -9.5], [7.6, -9.3]]}      # via, then router
  - {net: CS_OUT, layer: F.Cu, width: 0.15, pts: [[3.25, -4.775], [3.25, -3.875]]}          # via, then router
  # LD+ branch: LASER_P pour corner down J2's left side to C19, then R10 and TP3
