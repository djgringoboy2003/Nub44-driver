# Variant A (22 mm) placement and copper source file.
# Coordinates: mm relative to the board centre, +x right, +y down, viewed from the TOP side.
# rot is applied before flipping for bottom-side parts. Bottom-native footprints (spring pad,
# bottom test pads) are not flipped.
# Manual entries ("pos") fix the power stage, U1's satellites and mechanics; "auto" entries are placed by
# pcb_builder.auto_place at the nearest collision-free spot to the anchor, scored by net proximity.
#
# Layout rules from engineering/compact-feasibility.md and engineering/layout-review.md:
# - The centre spring pad J1 (B.Cu, r 2.50) forbids through vias within r 2.95 of the centre. L1 sits
#   over it (its pads need no vias); U1 is 2 mm below, so its via-needing pins clear the keep-out.
# - Every U1 pin has a source-defined escape before autorouting (fanout_skip U1).
# - BOOT1 (pin 22) and SW1 (pin 23) leave the top edge in parallel lanes that never cross: BOOT1 ends at
#   C5's upper pad, SW1 passes C5's lower pad and climbs left of C5 to the SW1 pour.
# - BOOT2 runs above C7 to C6, whose SW2 pad joins an extension of the SW2 pour. VCC is 0.6 mm long.
# - COMP, ILIM and FB passives sit on the bottom behind vias right of U1; the left column fans out to
#   staggered vias (DR1L, DR1H, VIN, EN, PG, CC).

board:
  outline: {type: circle, radius: 11.0}
  copper_layers: 4
  thickness: 1.6
placement_radius: 9.55         # every courtyard corner inside this radius (ring copper starts at 9.8)
courtyard_gap: 0.02          # courtyards may almost touch (they already include assembly clearance)
keepouts:                    # automatic placement stays off the via fields (they pass through both sides)
  B: [[-8.3, -6.6, -6.25, -3.3], [-1.95, -6.95, -1.25, -4.75], [2.3, 7.4, 3.65, 8.7],
      [-4.5, -4.45, -0.55, -1.45], [-0.45, 5.85, 1.4, 7.0],   # BAT_SPRING corridor; PGND/VOUT vias under U1
      [-9.3, -1.75, -3.4, -0.945], [-9.3, 3.345, -3.4, 4.15], [-9.3, -0.945, -8.495, 3.345],
      [-4.205, -0.945, -3.4, 3.345]]   # 0.8 mm ring around U3 kept free for its pin escapes
  F: [[-9.3, 3.345, -3.4, 4.15], [-9.3, -0.945, -8.495, 3.345], [-4.205, -0.945, -3.4, 3.345]]   # same ring
                                   # on top: a via needs both sides free (C1-C3 already cover its top edge)

parts:
  # mechanics and contacts
  J1: {pos: [0.0, 0.0, 0], side: B}                 # centre spring pad (bottom-native)
  J2: {pos: [0.0, 0.0, 0], side: F, no_courtyard: true}
  J3: {pos: [7.59, 0.0, 90], side: F, both_sides: true}  # 3.5 mm pads: LD+ (1) at (7.58, 1.75), LD- (2) at (7.58, -1.75)

  # power stage, top
  L1: {pos: [1.37, -2.65, 270], side: F}            # over the spring pad: pad 1 (SW1) top, pad 2 (SW2) toward U1
  U1: {pos: [0.6, 2.9, 0], side: F}                 # top-edge pins face L1 pad 2
  Q2: {pos: [-4.02, -5.4, 180], side: F}            # sources face L1 pad 1, drain faces the input caps
  C1: {pos: [-7.905, -1.6, 270], side: F}            # pad 1 (VBAT) up, pad 2 (GND) down
  C2: {pos: [-5.83, -1.6, 270], side: F}
  C3: {pos: [-3.76, -1.6, 270], side: F}            # leaves the SW1 lane at x -2.77 clear
  C14: {pos: [0.6, 5.57, 180], side: F}             # VOUT pin 11 <-> PGND pin 9, tightest boost loop
  C10: {pos: [0.6, 7.74, 180], side: F}
  RS1: {pos: [4.98, 4.95, 90], side: F}             # LD_P (pad 4) up toward J3 LD+, VOUT (pad 1) down
  C5: {pos: [-2.315, 0.45, 270], side: F}            # BOOT1 pad up (lane y 0.1), SW1 pad down (lane y 0.7)
  C6: {pos: [4.93, -0.36, 90], side: F}             # BOOT2 pad down (lane y 0.45), SW2 pad up to the pour
  C7: {pos: [4.645, 1.2, 0], side: F}                # VCC pad 0.6 mm from pin 19
  R2: {pos: [-0.6, 5.95, 270], side: F}             # FSW pad directly under pin 8, GND pad toward C10

  # power stage, bottom
  Q1: {pos: [-4.02, -5.4, 180], side: B}            # directly under Q2: VBAT changes layer through the via field beside both
  Q3: {pos: [0.79, -6.7, 0], side: B}                # SW1 vias sit between Q1's drain and Q3's drain
  U3: {pos: [-6.35, 1.2, 0], side: B}               # MCU below C1-C3: its blocked top edge holds the unused PC1-PC3, UPDI and
                                                    # LASER_EN; the analog pins face down, where vias fit
  C12: {pos: [-0.4, 8.1, 0], side: B}               # left of C13, below the PGND vias: the area under U1's pins 9/10 stays free
  C13: {pos: [2.4, 5.65, 90], side: B}
  C11: {pos: [4.48, 6.0, 90], side: B}
  U2: {pos: [4.67, -1.6, 0], side: B}               # CSA in the right-hand bottom column: U3, U2, D1, then passives
  D1: {pos: [4.52, 0.6, 0], side: B}                # laser clamp; LD_P pad reaches J3 LD+ (PTH) on B.Cu
  C9: {pos: [5.4, 3.25, 270], side: B}              # Cp directly behind the COMP via
  R9: {pos: [4.35, 3.25, 90], side: B}             # FB divider bottom resistor behind the FB via
  C8: {pos: [-1.5, 3.33, 0], side: B}              # Cc / Rc / ILIM in the strip between J1 and the output caps
  R4: {pos: [0.35, 3.3, 0], side: B}
  R3: {pos: [2.3, 3.3, 0], side: B}

  # external connection pads (top) and test/programming pads (bottom)
  TP13: {pos: [-8.3, 1.5, 0], side: F}
  TP11: {pos: [-7.8, 3.4, 0], side: F}
  TP9: {pos: [-6.7, 4.92, 0], side: F}
  TP10: {pos: [-5.35, 6.45, 0], side: F}
  TP12: {pos: [-3.75, 7.45, 0], side: F}
  TP1: {pos: [-7.814, -2.458, 180], side: B}   # place_opt
  TP8: {pos: [7.405, -4.030, 90], side: B}   # place_opt
  TP2: {pos: [-3.648, 7.291, 90], side: B}   # place_opt
  TP6: {pos: [-5.959, -2.403, 270], side: B}   # place_opt
  TP7: {pos: [0.205, -3.693, 90], side: B}   # place_opt

  # automatically placed parts: anchor = pad of a placed part (+ offset) or a board point
  C4: {pos: [-1.997, 4.270, 180], side: B}   # place_opt; VIN HF decoupling behind the VIN via
  R8: {pos: [7.224, 4.271, 90], side: B}   # place_opt
  R5: {pos: [-4.403, 4.557, 0], side: F}   # place_opt; EN divider behind the EN via
  R6: {pos: [-3.395, 5.998, 0], side: F}   # place_opt
  C15: {pos: [2.503, -3.234, 180], side: B}   # place_opt
  R7: {pos: [-2.574, 7.708, 270], side: B}   # place_opt
  R1: {pos: [-4.388, -7.653, 180], side: B}   # place_opt
  C16: {pos: [0.280, -7.248, 90], side: F}   # place_opt
  C17: {pos: [-4.478, 4.905, 270], side: B}   # place_opt
  D2: {pos: [-4.953, 1.527, 90], side: F}   # place_opt
  R10: {pos: [-6.743, 1.427, 0], side: F}   # place_opt
  R11: {pos: [-6.736, 5.371, 0], side: B}   # place_opt
  R12: {pos: [-5.688, 4.548, 0], side: B}   # place_opt
  R13: {pos: [-6.369, 2.598, 90], side: F}   # place_opt
  RT1: {pos: [-1.381, -7.687, 0], side: F}   # place_opt
  R14: {pos: [-6.477, 0.572, 180], side: F}   # place_opt
  R15: {pos: [-5.348, 5.719, 270], side: B}   # place_opt
  R16: {pos: [-7.349, 4.550, 180], side: B}   # place_opt
  R17: {pos: [1.863, -6.121, 0], side: F}   # place_opt
  R19: {pos: [-3.168, -8.014, 270], side: B}   # place_opt
  Q4: {pos: [4.477, -3.901, 0], side: B}   # place_opt
  Q5: {pos: [4.162, -6.246, 270], side: B}   # place_opt
  Q6: {pos: [5.734, -4.566, 180], side: F}   # place_opt
  R18: {pos: [-3.205, -7.740, 180], side: F}   # place_opt
  R20: {pos: [4.943, -2.693, 270], side: F}   # place_opt
  D3: {pos: [4.255, -6.462, 0], side: F}   # place_opt

# Battery polarity labels (REQ-BAT-04, DD-12): centre spring = B+, perimeter ring = B-. The legend meets
# PCBWay's limits (MFG-01: height >= 0.8 mm, stroke >= 0.15 mm and >= height / 5). Spots were chosen clear
# of courtyards, pads and vias; the board is too dense for longer words.
texts:
  - {text: "B+", at: [-2.8, -2.75], layer: B.Silkscreen, size: 0.8, thickness: 0.16}   # beside the spring pad
  - {text: "B-", at: [6.4, -5.4], layer: B.Silkscreen, size: 0.8, thickness: 0.16}    # beside the ring
  - {text: "B-", at: [3.4, -7.8], layer: F.Silkscreen, size: 0.8, thickness: 0.16}    # beside the ring, top

# automation/placement/place_opt.py ties these parts to the pin or via they serve
place_opt:
  near_weight: 3.0
  near: {C4: [-3.7, 2.9], C15: U2.3, C16: U3.4, C17: U3.4, D2: U3.4, R1: Q1.4, C9: U1.18, R5: [-3.45, 3.65], R6: [-3.45, 3.65],
         R10: U3.9, R11: U3.9, R14: U3.5, R15: U3.5, R16: U3.12, R12: U3.8, R13: U3.8,
         Q6: Q4.3, D3: Q4.3, R20: Q4.3}   # the over-voltage FET joins the other EN pull-downs

# ---------------------------------------------------------------------------- copper
# Stack-up roles: F.Cu power + signals, In1.Cu solid GND plane, In2.Cu signals (GND pour fills the rest), B.Cu power
# + signals. In2 carries no VBAT pour: the battery current runs B pour -> via field -> F pour, so inner copper on
# those vias would only be a side branch, and In2 is the one layer that can cross the board centre.
# Track widths: 0.15 mm signals, 0.25-0.40 mm drive/supply. Every source item is checked by KiCad DRC.

fanout_nets: [GND]                 # every GND SMD pad gets its own short track + via to In1
fanout_skip: [J2, U1]              # ring contact has stitching vias; U1 GND pins use the explicit escapes below

tracks:
  # RPM0026A centre pads cannot hold vias at PCBWay (DD-16): each is bridged to the edge pin beside it.
  - {net: SW2, layer: F.Cu, width: 0.25, pts: [[0.85, 1.50], [0.60, 2.25]]}      # pin 21 -> pad 25
  - {net: VOUT, layer: F.Cu, width: 0.30, pts: [[1.225, 3.55], [1.225, 4.30]]}   # pad 26 -> pin 11
  - {net: GND, layer: F.Cu, width: 0.30, pts: [[-0.025, 3.55], [-0.025, 4.30]]}  # pad 24 -> pin 9
  # top edge: BOOT1 lane above the SW1 lane; SW1 continues left of C5 up to the SW1 pour
  - {net: BOOT1, layer: F.Cu, width: 0.25, pts: [[0.35, 1.20], [0.35, 0.10], [-2.15, 0.10]]}
  - {net: SW1, layer: F.Cu, width: 0.20, pts: [[-0.45, 1.20], [-0.45, 0.68], [-2.77, 0.68], [-2.77, -3.60]]}
  - {net: BOOT2, layer: F.Cu, width: 0.25, pts: [[1.65, 1.20], [1.65, 0.45], [4.93, 0.45], [4.93, 0.10]]}
  - {net: VCC5, layer: F.Cu, width: 0.40, pts: [[2.45, 1.24], [3.50, 1.24]]}
  # right column: COMP, ILIM, GND (MODE), FB to vias; ISN/ISP pair to the shunt sense pads
  - {net: COMP, layer: F.Cu, width: 0.15, pts: [[2.55, 1.90], [5.00, 1.90], [5.40, 2.30]]}
  - {net: ILIM, layer: F.Cu, width: 0.15, pts: [[2.55, 2.40], [3.20, 2.40], [3.45, 2.65]]}
  - {net: GND, layer: F.Cu, width: 0.20, pts: [[2.55, 3.40], [3.45, 3.40]]}
  - {net: FB, layer: F.Cu, width: 0.15, pts: [[2.55, 3.90], [3.20, 3.90], [3.45, 4.15], [3.65, 4.15]]}
  - {net: FB, layer: B.Cu, width: 0.15, pts: [[3.65, 4.15], [5.75, 4.15], [6.10, 3.85], [7.22, 3.85]]}   # R9 -> R8 under C9, clear of the ISN via
  - {net: FB, layer: B.Cu, width: 0.15, pts: [[4.35, 3.76], [4.35, 4.15]]}
  - {net: ISN_K, layer: F.Cu, width: 0.15, pts: [[2.45, 4.39], [2.55, 4.49], [2.55, 4.70], [4.70, 4.70], [4.99, 4.55]]}
  - {net: ISP_K, layer: F.Cu, width: 0.15, pts: [[1.725, 4.60], [1.725, 5.10], [4.99, 5.10], [4.99, 5.40]]}
  - {net: ISN_K, layer: F.Cu, width: 0.15, pts: [[5.10, 4.40], [6.25, 4.40], [6.25, 4.50]]}
  - {net: ISP_K, layer: F.Cu, width: 0.15, pts: [[5.10, 5.50], [6.25, 5.50]]}
  # left column fans out to staggered vias outside the spring-pad keep-out
  - {net: DR1L, layer: F.Cu, width: 0.20, pts: [[-1.30, 1.35], [-2.95, 1.35]]}
  - {net: DR1H, layer: F.Cu, width: 0.20, pts: [[-1.30, 1.90], [-3.75, 1.90]]}
  - {net: VBAT, layer: F.Cu, width: 0.20, pts: [[-1.30, 2.40], [-3.20, 2.40], [-3.70, 2.90]]}
  - {net: EN_UVLO, layer: F.Cu, width: 0.15, pts: [[-1.30, 2.90], [-2.70, 2.90], [-3.45, 3.65]]}
  - {net: PG, layer: F.Cu, width: 0.15, pts: [[-1.30, 3.40], [-2.20, 3.40], [-3.20, 4.40]]}
  - {net: CC_FLAG, layer: F.Cu, width: 0.15, pts: [[-1.30, 3.90], [-1.70, 3.90], [-2.95, 5.15]]}
  # bottom edge: GND pin 7 to its via, FSW straight down to R2
  - {net: GND, layer: F.Cu, width: 0.20, pts: [[-1.25, 4.60], [-1.25, 5.20], [-1.55, 5.65]]}
  - {net: FSW, layer: F.Cu, width: 0.15, pts: [[-0.525, 4.60], [-0.525, 5.50]]}
  # Q2 gate: out of its pocket between the VBAT and SW1 pours to a via (inner layers carry it to U1)
  - {net: DR1H, layer: F.Cu, width: 0.20, pts: [[-2.585, -6.39], [-2.25, -6.65], [-2.25, -7.10]]}
  # PGND (pins 9/24, AGND pin 10 beside them) to C14's ground pad and a plane via directly below
  - {net: GND, layer: F.Cu, width: 0.30, pts: [[0.00, 4.60], [0.00, 5.40]]}
  - {net: GND, layer: F.Cu, width: 0.30, pts: [[0.20, 5.60], [-0.05, 6.35]]}

vias:
  - {net: DR1L, x: -2.95, y: 1.35}
  - {net: DR1H, x: -3.75, y: 1.90}
  - {net: DR1H, x: -2.25, y: -7.10}               # beside the Q2 gate
  - {net: VBAT, x: -3.70, y: 2.90}
  - {net: EN_UVLO, x: -3.45, y: 3.65}
  - {net: PG, x: -3.20, y: 4.40}
  - {net: CC_FLAG, x: -2.95, y: 5.15}
  - {net: GND, x: -1.55, y: 5.65}
  - {net: GND, x: -0.05, y: 6.35}                  # PGND to the In1 plane
  - {net: COMP, x: 5.40, y: 2.30}
  - {net: ILIM, x: 3.45, y: 2.65}
  - {net: GND, x: 3.45, y: 3.40}
  - {net: FB, x: 3.65, y: 4.15}
  - {net: ISN_K, x: 6.25, y: 4.50}
  - {net: ISP_K, x: 6.25, y: 5.50}

via_fields:
  - {net: VBAT, count: 8, pitch: 0.75, polygon: [[-8.15, -3.45], [-6.4, -3.45], [-6.4, -6.1], [-7.0, -6.5], [-8.15, -4.9]]}   # beside Q1 sources / Q2 drain
  - {net: SW1, count: 3, pitch: 0.75, polygon: [[-1.95, -6.75], [-1.2, -6.75], [-1.2, -5.05], [-1.95, -5.05]]}   # between Q1 and Q3 drains
  - {net: VOUT, count: 2, pitch: 0.75, polygon: [[0.55, 6.0], [1.3, 6.0], [1.3, 6.9], [0.55, 6.9]]}   # under U1's VOUT column
  - {net: VOUT, count: 3, pitch: 0.8, polygon: [[2.35, 7.45], [3.6, 7.45], [3.6, 8.65], [2.35, 8.65]]}

zones_pre:
  - {net: GND, layer: In1.Cu, circle: [0, 0, 10.6], priority: 0, solid: true}
  - {net: VBAT, layer: F.Cu, priority: 2, solid: true,
     polygon: [[-8.9, -1.85], [-3.0, -1.85], [-3.0, -3.5], [-3.4, -3.5], [-3.4, -6.8], [-6.6, -6.8], [-7.6, -5.8], [-8.9, -3.9]]}
  - {net: VBAT, layer: B.Cu, priority: 2, solid: true,   # Q1 sources and the VBAT via field
     polygon: [[-8.3, -3.35], [-4.85, -3.35], [-4.85, -6.05], [-6.15, -6.05], [-6.15, -6.4], [-7.1, -6.45], [-8.3, -4.9]]}
  - {net: SW1, layer: F.Cu, priority: 2, solid: true,
     polygon: [[-3.25, -6.0], [-1.85, -6.0], [-1.85, -6.95], [-0.5, -6.95], [-0.5, -5.0], [3.85, -5.0], [3.85, -3.55], [-3.25, -3.55]]}
  - {net: SW1, layer: B.Cu, priority: 2, solid: true,   # Q3 drain and the SW1 vias
     polygon: [[-1.95, -7.95], [1.2, -7.95], [1.2, -5.4], [-0.9, -5.4], [-0.9, -4.75], [-1.95, -4.75]]}
  - {net: SW2, layer: F.Cu, priority: 2, solid: true,
     polygon: [[-1.0, -1.75], [3.85, -1.75], [3.85, -1.35], [5.25, -1.35], [5.25, -0.40], [3.85, -0.40], [3.85, -0.25], [1.33, -0.25], [1.33, 1.0], [0.68, 1.0], [0.68, -0.25], [-1.0, -0.25]]}
  - {net: VOUT, layer: F.Cu, priority: 2, solid: true,
     polygon: [[0.75, 4.3], [1.5, 4.3], [1.5, 5.35], [3.9, 5.35], [3.9, 5.75], [6.0, 5.75], [6.0, 7.15], [3.9, 7.15], [3.9, 8.2], [3.4, 8.75], [0.15, 8.75], [0.15, 8.5], [0.95, 8.5], [0.95, 6.6], [0.62, 6.6], [0.62, 5.25], [0.75, 5.25]]}
  - {net: VOUT, layer: B.Cu, priority: 2, solid: true,
     polygon: [[-0.75, 4.3], [5.5, 4.3], [5.5, 7.8], [3.7, 7.8], [3.7, 8.75], [-0.3, 8.75], [-0.3, 7.25], [-0.75, 7.25]]}
  - {net: LD_P, layer: F.Cu, priority: 2, solid: true,
     polygon: [[4.0, 2.75], [5.7, 2.75], [6.3, 2.0], [6.3, 0.55], [8.8, 0.55], [8.8, 3.2], [6.9, 3.6], [6.2, 4.15], [4.0, 4.15]]}
  - {net: BAT_SPRING, layer: B.Cu, priority: 2, solid: true,   # Q1 drain straight to the spring pad
     polygon: [[-4.45, -6.75], [-2.05, -6.75], [-2.05, -4.4], [-0.6, -2.9], [-0.6, -1.5], [-2.7, -1.5], [-4.45, -3.6]]}

zones_post:
  - {net: GND, layer: In2.Cu, circle: [0, 0, 10.6], priority: 1, clearance: 0.2, thermal_gap: 0.2, spoke: 0.25}
  - {net: GND, layer: F.Cu, circle: [0, 0, 10.6], priority: 1, clearance: 0.2, thermal_gap: 0.2, spoke: 0.25}
  - {net: GND, layer: B.Cu, circle: [0, 0, 10.6], priority: 1, clearance: 0.2, thermal_gap: 0.2, spoke: 0.25}


# Grid router (automation/placement/grid_route.py): joins the open groups of these nets, in this order,
# on F.Cu, In2.Cu and B.Cu, and writes the copper to the generated grid_routes section at the end.
grid_route:
  nets: [SW_IN, IND_OUT, IND_PAD, UPDI, VBAT_SENSE, VOUT_SENSE, NTC_PWR, NTC_LD, NTC_BRD, INTLK_MCU,
         CC_FLAG, PG, LASER_EN_N, VMCU, CS_OUT, OV_G, EN_UVLO, INTLK_N, Q1_G, DR1H, DR1L, ISN_K, ISP_K, FB,
         VBAT, VOUT, COMP, COMP_RC, ILIM, FSW, BOOT1, BOOT2, VCC5, LD_P]   # MCU escapes first
  widths: {DR1H: 0.2, DR1L: 0.2, VBAT: 0.25, VOUT: 0.25, VMCU: 0.2, LD_P: 0.3}
  layers: [F.Cu, In2.Cu, B.Cu]
  layer_cost: {F.Cu: 1.5, B.Cu: 1.5}   # long runs on In2 keep the outer layers free for pin escapes

# Router keep-outs: while routing, other nets may not cross the power copper (the Specctra export
# treats pours as conduction planes). They exist only in the placed board; finish deletes them.
# "net" names the protected pour: the build cuts each area back around vias of other routed nets
# (a via inside a keep-out is unreachable for the router).
router_keepouts:
