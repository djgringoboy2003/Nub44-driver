  - {net: VBAT, layer: In2.Cu, priority: 2, solid: true,   # left region: battery current path Q1 -> C1-C3/Q2 and U1 VIN
     polygon: [[-2.6, -9.6], [-2.6, 3.4], [-10.4, 3.4], [-10.2, -2.5], [-9.0, -5.5], [-7.0, -7.6], [-4.5, -9.2]]}
  - {net: VBAT, layer: F.Cu, priority: 2, solid: true,
     polygon: [[-8.9, -1.85], [-3.0, -1.85], [-3.0, -3.5], [-3.4, -3.5], [-3.4, -6.8], [-5.8, -6.8], [-7.4, -5.4], [-8.9, -3.9]]}
  - {net: VBAT, layer: B.Cu, priority: 2, solid: true,   # Q1 sources and the VBAT via field
     polygon: [[-8.3, -3.35], [-4.85, -3.35], [-4.85, -6.05], [-6.15, -6.05], [-6.15, -6.4], [-7.1, -6.45], [-8.3, -4.9]]}
  - {net: SW1, layer: F.Cu, priority: 2, solid: true,
     polygon: [[-3.25, -6.0], [-1.85, -6.0], [-1.85, -6.95], [-0.5, -6.95], [-0.5, -5.0], [3.85, -5.0], [3.85, -3.55], [-3.25, -3.55]]}
  - {net: SW1, layer: B.Cu, priority: 2, solid: true,   # Q3 drain and the SW1 vias
     polygon: [[-1.95, -7.95], [1.2, -7.95], [1.2, -5.4], [-0.9, -5.4], [-0.9, -4.75], [-1.95, -4.75]]}
  - {net: SW2, layer: F.Cu, priority: 2, solid: true,
     polygon: [[-1.0, -1.75], [3.85, -1.75], [3.85, -1.35], [5.25, -1.35], [5.25, -0.40], [3.85, -0.40], [3.85, -0.25], [1.33, -0.25], [1.33, 1.0], [0.68, 1.0], [0.68, -0.25], [-1.0, -0.25]]}
  - {net: VOUT, layer: F.Cu, priority: 2, solid: true,
     polygon: [[0.75, 4.3], [1.5, 4.3], [1.5, 5.35], [3.9, 5.35], [3.9, 5.75], [6.0, 5.75], [6.0, 7.15], [3.9, 7.15], [3.9, 8.2], [3.4, 8.75], [0.15, 8.75], [0.15, 8.5], [0.95, 8.5], [0.95, 6.6], [0.62, 6.6], [0.62, 5.25], [0.75, 5.25]]}
  - {net: VOUT, layer: B.Cu, priority: 2, solid: true,
     polygon: [[-0.75, 4.3], [5.5, 4.3], [5.5, 7.8], [3.7, 7.8], [3.7, 8.75], [0.15, 8.75], [0.15, 7.8], [-0.75, 7.8]]}
  - {net: LD_P, layer: F.Cu, priority: 2, solid: true,
     polygon: [[4.0, 2.75], [5.7, 2.75], [6.3, 2.0], [6.3, 0.55], [8.8, 0.55], [8.8, 3.2], [6.9, 3.6], [6.2, 4.15], [4.0, 4.15]]}
  - {net: BAT_SPRING, layer: B.Cu, priority: 2, solid: true,   # Q1 drain straight to the spring pad
     polygon: [[-4.45, -6.75], [-2.05, -6.75], [-2.05, -4.4], [-0.6, -2.9], [-0.6, -1.5], [-2.7, -1.5], [-4.45, -3.6]]}

zones_post:
