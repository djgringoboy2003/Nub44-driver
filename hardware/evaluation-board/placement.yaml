  - {net: GND, x: -0.8, y: -1.5}
  - {net: GND, x: 2.75, y: -3.5}
  - {net: GND, x: 0.0, y: 10.2}
  - {net: PG, x: -2.8, y: -3.5}
  - {net: PG, x: 5.3, y: 9.8}
  - {net: VMCU, x: 0.7, y: 10.8}
  - {net: VMCU, x: -1.85, y: 10.0}
  - {net: SW_IN, x: -0.2, y: 9.2}
  - {net: NTC_BRD, x: 1.4, y: 13.2}
  - {net: CS_OUT, x: 2.2, y: 13.2}
  - {net: VOUT_SENSE, x: 3.0, y: 13.2}
  - {net: VBAT_SENSE, x: 3.8, y: 13.2}
  - {net: NTC_LD, x: 4.6, y: 13.2}

