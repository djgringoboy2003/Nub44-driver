# Machine-readable criteria of the bench test plan (documentation/testing/test-plan.md), used by
# automation/bench/bench.py to judge recorded MEASUREMENTS. The prose plan stays authoritative for methods and
# safety; tests/test_bench.py checks that every ID here exists there.
#
# quantity fields: name, unit, and one of
#   min / max / range: [lo, hi] / equals   -> judged
#   record: true                           -> must be present, not judged
#   when: {condition: value}               -> the limit applies only to measurements taken at these conditions
#   abs: true                              -> judge the absolute value
# prediction: where the design predicts a value (shown beside the measurement, never used to pass a test):
#   {source: calculation, path: [...]} | {source: calculation-check, check: "<prefix>"} |
#   {source: simulation, id: SIM-xx, metric: name}; optional scale (e.g. 1000 for s -> ms)
# gate_g: variants for which a PASS record is required to close Gate G.

tests:
  - id: T0.1
    title: Visual / X-ray inspection of U1 and U3
    gate_g: [evaluation-board, compact-22mm]
    quantities:
      - {name: solder_defects, unit: count, equals: 0}
  - id: T0.2
    title: Polarity marks against the assembly drawings
    gate_g: [evaluation-board, compact-22mm]
    quantities:
      - {name: misoriented_parts, unit: count, equals: 0}
  - id: T0.3
    title: Short check VBAT-GND, VOUT-GND, LD+-LD-
    gate_g: [evaluation-board, compact-22mm]
    quantities:
      - {name: r_vbat_gnd_ohm, unit: ohm, min: 1000}
      - {name: r_vout_gnd_ohm, unit: ohm, min: 1000}
      - {name: r_ld_ohm, unit: ohm, min: 1000}
  - id: T0.4
    title: Fuse readback
    gate_g: [evaluation-board, compact-22mm]
    quantities:
      - {name: bodcfg, unit: hex, equals: "0x06"}
      - {name: osccfg_freqsel, unit: hex, equals: "0x02"}
  - id: T1.1
    title: First power-up, idle current, no output
    gate_g: [evaluation-board, compact-22mm]
    quantities:
      - {name: i_idle_ma, unit: mA, max: 2.0}
      - {name: vout_idle_v, unit: V, max: 0.1}
  - id: T1.2
    title: Default-off and emission delay
    gate_g: [evaluation-board, compact-22mm]
    quantities:
      - {name: i_before_delay_ma, unit: mA, max: 10}
      - {name: emission_delay_s, unit: s, min: 2.0}
  - id: T1.3
    title: Soft start and overshoot
    gate_g: [evaluation-board, compact-22mm]
    quantities:
      - {name: i_peak_a, unit: A, max: 4.95, prediction: {source: simulation, id: SIM-01, metric: peak_a}}
      - {name: ramp_ms, unit: ms, record: true}
  - id: T1.4
    title: Regulation accuracy over supply and dummy-load Vf
    gate_g: [evaluation-board, compact-22mm]
    quantities:
      - {name: i_out_a, unit: A, range: [4.275, 4.725], prediction: {source: calculation, path: [setpoint, i_set_nominal_a]}}
  - id: T1.5
    title: Regulation with Vf below Vbat (buck mode)
    gate_g: [evaluation-board, compact-22mm]
    quantities:
      - {name: i_out_a, unit: A, range: [4.275, 4.725]}
  - id: T1.6
    title: Laser-current ripple
    gate_g: [evaluation-board, compact-22mm]
    quantities:
      - {name: ripple_pct_pp, unit: "%", max: 10.0, prediction: {source: calculation-check, check: "Laser current ripple"}}
  - id: T1.7
    title: Efficiency
    gate_g: [evaluation-board, compact-22mm]
    quantities:
      - {name: efficiency_pct, unit: "%", min: 94.0, when: {vin_v: 4.0},
         prediction: {source: calculation-check, check: "Efficiency at 4.0 V"}}
      - {name: efficiency_pct, unit: "%", min: 86.0, when: {vin_v: 3.0},
         prediction: {source: calculation-check, check: "Efficiency at 3.0 V"}}
  - id: T1.8
    title: Flash mode and mode change by power gap
    gate_g: [evaluation-board, compact-22mm]
    quantities:
      - {name: mode_changes_per_click, unit: count, equals: 1}
      - {name: off_to_50ma_ms, unit: ms, max: 1.0, prediction: {source: simulation, id: SIM-06, metric: turn_off_to_50mA_s, scale: 1000}}
  - id: T1.9
    title: Mode memory timing
    gate_g: [evaluation-board, compact-22mm]
    quantities:
      - {name: glitch_threshold_ms, unit: ms, record: true}
      - {name: click_threshold_ms, unit: ms, record: true}
      - {name: vmcu_min_v, unit: V, record: true}
  - id: T1.10
    title: CC pin polarity
    gate_g: [evaluation-board]
    quantities:
      - {name: cc_active_low, unit: bool, equals: true}
  - id: T1.11
    title: Measurement chain against a DMM
    gate_g: [evaluation-board, compact-22mm]
    quantities:
      - {name: vbat_error_pct, unit: "%", max: 3.0, abs: true}
      - {name: current_error_pct, unit: "%", max: 5.0, abs: true}
  - id: T2.1
    title: Interlock opens during emission
    gate_g: [evaluation-board, compact-22mm]
    quantities:
      - {name: shutdown_ms, unit: ms, max: 1.0, prediction: {source: simulation, id: SIM-07, metric: time_to_50mA_s, scale: 1000}}
      - {name: restarts_without_power_cycle, unit: bool, equals: false}
  - id: T2.2
    title: Open load
    gate_g: [evaluation-board]
    quantities:
      - {name: vout_peak_v, unit: V, max: 7.0, prediction: {source: simulation, id: SIM-09, metric: peak_vout_v}}
      - {name: fault_latched, unit: bool, equals: true}
  - id: T2.3
    title: Output short circuit
    gate_g: [evaluation-board]
    quantities:
      - {name: i_short_a, unit: A, max: 5.2, prediction: {source: simulation, id: SIM-08, metric: settled_output_current_a}}
      - {name: fault_latched, unit: bool, equals: true}
  - id: T2.4
    title: Backup current ceiling
    gate_g: [evaluation-board]
    quantities:
      - {name: i_ceiling_a, unit: A, range: [4.8, 5.2], prediction: {source: calculation, path: [setpoint, backup_limit_a]}}
      - {name: cc_flag_asserted, unit: bool, equals: true}
  - id: T2.5
    title: Reverse polarity
    gate_g: [evaluation-board, compact-22mm]
    quantities:
      - {name: i_reverse_ma, unit: mA, max: 1.0, prediction: {source: simulation, id: SIM-10, metric: reverse_current_a, scale: 1000}}
      - {name: works_afterwards, unit: bool, equals: true}
  - id: T2.6
    title: Undervoltage lockout
    gate_g: [evaluation-board, compact-22mm]
    quantities:
      - {name: uvlo_off_v, unit: V, range: [2.745, 2.915], prediction: {source: calculation, path: [uvlo, v_off]}}
      - {name: uvlo_on_v, unit: V, range: [2.988, 3.172], prediction: {source: calculation, path: [uvlo, v_on]}}
  - id: T2.7
    title: Thermal at 4.5 A continuous
    gate_g: [evaluation-board, compact-22mm]
    quantities:
      - {name: t_u1_case_c, unit: C, record: true}
      - {name: t_l1_c, unit: C, record: true}
      - {name: t_q1_c, unit: C, record: true}
      - {name: t_rs1_c, unit: C, record: true}
      - {name: firmware_stop_board_c, unit: C, range: [83.0, 87.0]}
  - id: T2.8
    title: Hot insertion
    gate_g: [evaluation-board, compact-22mm]
    quantities:
      - {name: vin_overshoot_v, unit: V, max: 6.0}
  - id: T2.9
    title: Switch-node and gate waveforms
    gate_g: [evaluation-board]
    quantities:
      - {name: sw2_peak_v, unit: V, record: true}
      - {name: sw1_ringing_v, unit: V, record: true}
  - id: T2.10
    title: VCC ripple
    gate_g: [evaluation-board]
    quantities:
      - {name: vcc_ripple_mv_pp, unit: mV, record: true}
  - id: T2.11
    title: Control-node noise and current jitter
    gate_g: [evaluation-board]
    quantities:
      - {name: current_offset_pct, unit: "%", max: 5.0, abs: true}
  - id: T2.12
    title: U1 power-pin temperature
    gate_g: [evaluation-board]
    quantities:
      - {name: t_u1_top_edge_c, unit: C, record: true}
  - id: T2.13
    title: Sensor faults
    gate_g: [evaluation-board, compact-22mm]
    quantities:
      - {name: fault_code_board_ntc_short, unit: code, equals: 11}
      - {name: fault_code_laser_ntc_lost, unit: code, equals: 12}
      - {name: normal_without_laser_ntc, unit: bool, equals: true}
  - id: T3.1
    title: Real cells to cut-off
    gate_g: [evaluation-board, compact-22mm]
    quantities:
      - {name: cutoff_v, unit: V, min: 2.83}
      - {name: regulation_held, unit: bool, equals: true}
      - {name: runtime_min, unit: min, record: true}
  - id: T3.2
    title: Contact resistance (spring and ring)
    gate_g: [compact-22mm]
    quantities:
      - {name: r_contacts_mohm, unit: mOhm, max: 20.0}
  - id: T3.3
    title: Polarity confirmation in the host
    gate_g: [compact-22mm]
    quantities:
      - {name: polarity_matches, unit: bool, equals: true}
  - id: T4.1
    title: Diode check (controlled area)
    gate_g: []
    quantities:
      - {name: case_isolated, unit: bool, equals: true}
  - id: T4.2
    title: First light at reduced current (controlled area)
    gate_g: []
    quantities:
      - {name: stable_output, unit: bool, equals: true}
      - {name: case_temp_c, unit: C, record: true}
  - id: T4.3
    title: Full current with the diode (controlled area)
    gate_g: []
    quantities:
      - {name: case_temp_c, unit: C, max: 65.0}
      - {name: optical_power_w, unit: W, record: true}
