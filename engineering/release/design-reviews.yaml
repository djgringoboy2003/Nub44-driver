# 2026-10-27: evaluation and compact scopes separated. See reports/pre-order-review.md.
# AUD-VAL-11/12: required-ID and dependency-hash enforcement still need fixes.
#
# To close a review, set `status: DONE` and fill `reviewer`, `date` (YYYY-MM-DD) and `evidence` (what was
# compared, with document revision and page). A review applies to the variants listed. Never mark a review DONE
