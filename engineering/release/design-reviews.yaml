# Human reviews required before a board can be classified PROTOTYPE_CANDIDATE or MANUFACTURING_RELEASE
# (audit AUD-MFG-02, AUD-PCB-03). Automation cannot perform these; it only checks that each is recorded.
#
# To close a review, set `status: DONE` and fill `reviewer`, `date` (YYYY-MM-DD) and `evidence` (what was
# compared, with document revision and page). A review applies to the variants listed. Never mark a review DONE
# without performing it.

reviews:
  - id: FP-U1
    level: PROTOTYPE_CANDIDATE
    variants: [evaluation-board, compact-22mm]
    item: >-
      TPS552882 RPM0026A land pattern (nubm44:TI_RPM0026A_VQFN-HR-26_4x3.5mm_P0.5mm, generated from PDF vector
      geometry) against TI's mechanical and land-pattern drawings in SLVSFC5: pad sizes, 0.5 mm pitch, the three
      centre pads, pin 1 and the bridged centre-pad connections (DD-16).
    status: OPEN
    reviewer: null
    date: null
    evidence: null
