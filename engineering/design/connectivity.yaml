# Authoritative parts list and pin-to-net connectivity for the NUBM44 driver.
# - The schematic generator (automation/schematic/build_schematic.py) draws exactly this.
# - The validator compares KiCad's exported netlist against it, pin by pin.
# - Pin numbers are symbol/footprint pad numbers (verified sources in research/source-index.md).
# - "NC" marks an intentionally unconnected pin (gets a no-connect flag).
# - footprint_eval / mpn_eval / mfr_eval override for Variant B (evaluation board) only.
# - variants: [..] restricts a part to the listed variants (default: all).
# - Values that come from calculations are traced in engineering/calculations/power-stage-results.md.

meta:
  project: nubm44_driver
  title: NUBM44 laser diode driver
  revision: A
  date: 2026-10-24
  polarity: {centre_spring: B+, perimeter_ring: B-, confirmed: true, ref: REQ-BAT-04 / DD-12}   # owner 2026-10-25: either orientation, marked on the silkscreen

blocks:
  power_in: "Battery input and reverse-polarity protection"
  converter: "TPS552882 4-switch buck-boost power stage"
  sense: "Laser current sensing, regulation feedback and output"
  control: "ATtiny1616 control, monitoring and user interface"
  enable: "Hardware enable chain: default-off, interlock, over-voltage backstop"

power_flags: [VBAT, GND, VMCU]

