# Authoritative parts list and pin-to-net connectivity for the separate BUDGET-2S driver (DD-30...DD-34).
# - automation/budget/build_schematic.py draws exactly this and compares KiCad's netlist with it pin by pin.
# - Pin numbers are symbol/footprint pad numbers; pin tables cite their source in the symbol YAML or below.
# - "NC" marks an intentionally unconnected pin. "GND" pins get ground symbols.
# - Values come from engineering/design/budget-2s/parameters.yaml and the generated qualification report.
# - mpn UNKNOWN means the line is specified by its description and still needs a sourced part (DD-34).
# - DRAFT for schematic/ERC: footprints prefixed budget2s: are not generated yet (OPEN), no PCB exists.

meta:
  project: nubm44_budget2s
  title: NUBM44 budget 2S driver
  revision: B3-draft
  date: 2026-10-29

blocks:
  power_in: "2S input: connector, fuse, reverse-polarity P-FET, clamps, bulk input"
  converter: "TPS54821 synchronous buck, compensation and output filter"
  sense: "Shunt, INA186 regulation feedback, INA300 backup trip, output disconnect"
  enable: "Default-off interface (DD-32): nFAULT line, latch, monitors, series AND switches"
  control: "3.3 V rail, ATtiny1616, measurement and user interface"

power_flags: [VBAT_P, GND]

