# Authoritative numeric inputs for BUDGET-2S engineering development (DD-30).
# These are candidate design values and source limits, NOT an approved circuit.
# UNKNOWN is intentional. Do not promote an assumption to a guaranteed limit.
schema: nubm44-budget-parameters.v1
meta:
  revision: B3-sourcing  # DD-34 sourcing swaps; DD-33 4.5 A setpoint; DD-31/32 power model and interface
  date: '2026-10-29'
  status: ELECTRICAL_QUALIFICATION
  decision: DD-30
  variant: budget-2s

targets:  # Owner brief / REQ-BUD-01...09; proposed voltage/efficiency details.
  # Owner decision 2026-10-29 (DD-33): main setpoint 4.5 A (was 4.0 A); about 7.3 W optical per the owner.
  # Exceeds the 4.2 A maximum operating current in LD-05 (single secondary source); diode-life risk recorded.
  current_a: 4.5
  accuracy_fraction: 0.05
  normal_peak_a: 4.95  # 1.1 x setpoint, the same ratio as REQ-OUT-05 (4.4 A at 4.0 A).
  # Owner-supplied NUBM44 operating points [A, V] (OWNER-VI-01). The last is the main setpoint; the others
  # are one-resistor build options. Not measurements by this project.
  laser_vi_points: [[3.0, 4.40], [3.5, 4.52], [4.0, 4.62], [4.5, 4.72]]
  laser_v_min: 3.8  # Compliance range the driver must regulate across (diode spread and temperature).
  laser_v_typ: 4.72  # OWNER-VI-01 at the 4.5 A main setpoint; efficiency condition.
  laser_v_max: 5.2
  board_c_min: 0
  board_c_max: 50
  input_v_min: 6.0  # Proposed connector voltage; dropout bound computed by automation/budget/power.py.
  input_v_nominal: 7.4
  input_v_max: 8.4
  pack_cutoff_floor_v: 5.0  # ASSUMPTION: 2 x 2.5 V/cell rated discharge cutoff; exact pack OPEN (REQ-BUD-05).
  # Owner decision 2026-10-29 (DD-31 option a, confirmed with DD-33): judged by bench measurement at
  # 7.4 V / main setpoint / its OWNER-VI-01 voltage. Was 0.94. All corners and V-I points stay reported.
  efficiency_fraction: 0.93
  # Proposed backup-trip window (DD-33): above the normal transient peak, below about 1.25 x setpoint.
  backup_trip_a_min: 5.0
  backup_trip_a_max: 5.6
  board_thermal_trip_c: 85
  laser_thermal_trip_c: 60
  arming_hold_s: 2.0
  flash_hz: 2.0
  flash_duty: 0.5
  cost_gbp_per_working_driver: 60
  compare_working_quantities: [3, 5]

buck:  # BUD-01, SLVSB14B pp.5-6. No inferred limits at an arbitrary RT value.
  mpn: TPS54821RHLT
  source: BUD-01
  reference_v: 0.600
  reference_v_min: 0.594
  reference_v_max: 0.606
  input_operating_v_min: 4.5
  input_operating_v_max: 17.0
  rt_ohm: 100000  # Datasheet frequency test point, including 1% timing resistor.
  frequency_hz: 480000
  frequency_hz_min: 400000
  frequency_hz_max: 560000
  high_side_current_limit_a_max: 17.0
  # p.5 table limits apply over TJ -40...125 C and are measured at pins. BOOT-PH = 3 V is the
  # conservative condition (BOOT-PH = 6 V gives 26/40 mOhm); the boot regulator level is not specified.
  high_side_r_ohm_typ: 0.032
  high_side_r_ohm_max: 0.060
  low_side_r_ohm_typ: 0.019  # VIN = 12 V test condition; applicability at 5.4-8.4 V OPEN.
  low_side_r_ohm_max: 0.030
  min_on_s_max: 0.000000145
  min_off_s_max: 0  # p.6, BOOT-PH >= 3 V; p.15 100% duty until BOOT-PH UVLO (3 V max) forces a refresh.
  nonswitching_iq_a_typ: 0.0006  # p.5, VSENSE = 610 mV; switching gate drive is in `estimates`.
  nonswitching_iq_a_max: 0.0008
  en_rising_v_max: 1.26  # p.5; no rising minimum is given.
  en_falling_v_min: 1.10  # p.5; below this the converter is guaranteed disabled.
  en_pullup_a_typ: 0.00000115  # p.5, EN = 1.1 V. TYPICAL ONLY: no maximum specified.
  en_hysteresis_a_typ: 0.0000033  # p.5, EN = 1.3 V. TYPICAL ONLY.
  en_abs_max_v: 6.0  # p.3
  error_amplifier_gm_s_typ: 0.0013
  modulator_gm_a_per_v_typ: 21
  boot_cap_f: 0.000000100
  ss_cap_f: 0.000000022  # Candidate ~5.74 ms reference ramp, not proven CC ramp.
  ss_charge_a_typ: 0.0000023
  switch_loss_w: UNKNOWN
  minimum_boot_refresh_duty: UNKNOWN

inductor:  # BUD-05; room-temperature catalogue limits, not hot/bias guarantees.
  mpn: SRP1265A-4R7M
  source: BUD-05
  l_h: 0.0000047
  tolerance_fraction: 0.20
  dcr_ohm_typ_25c: 0.0070
  dcr_ohm_max_25c: 0.0084
  irms_a_40c_rise: 13.5
  isat_a_20pct_l_drop: 28.0
  minimum_l_h_hot_biased: UNKNOWN
  core_loss_w: UNKNOWN

current_sense:  # PREORDER-07 / BUD-22. Resistor procurement qualification OPEN.
  amplifier_mpn: INA186A2IDCKR
  amplifier_source: PREORDER-07
  gain: 50
  gain_error_fraction: 0.01
  gain_drift_fraction_per_c: 0.000010
  offset_v_max_25c: 0.000050
  offset_drift_v_per_c_max: 0.0000005
  cmrr_db_min: 120
  offset_test_common_mode_v: 12
  psrr_v_per_v_max: 0.000010
  offset_test_supply_v: 1.8
  # DD-34: WSK2512 four-terminal part not readily available; Vishay WSL2512 two-terminal (LCSC C844901),
  # Kelvin sense traces taken from the pad edges. BUD-24 doc 30100 p.1-2: 1 W at 70 C, +/-75 ppm/C (7-500 mOhm).
  shunt_mpn: WSL2512R0100FEA
  shunt_source: BUD-24
  shunt_ohm: 0.010
  shunt_tolerance_fraction: 0.01
  shunt_tcr_fraction_per_c: 0.000075
  shunt_power_w_at_70c: 1.0
  shunt_delta_c_from_25: 50  # ASSUMPTION: includes self heating; bench must bound.
  fb_top_ohm: 27400  # E96; 4.5 A main setpoint (DD-33). Was 23.2k for 4.0 A.
  fb_bottom_ohm: 10000
  fb_resistor_tolerance_fraction: 0.001  # PROCUREMENT REQUIREMENT, not verified MPN.
  fb_resistor_tcr_fraction_per_c: 0.000025  # PROCUREMENT REQUIREMENT.
  fb_resistor_delta_c_from_25: 25
  fb_resistor_mpns: UNKNOWN
  amplifier_bandwidth_hz_typ: 37000

backup:  # BUD-06 pp.5,12,15,17-19. Fast mode MUST include 500 uV NAF.
  mpn: INA300AIDGSR
  source: BUD-06
  limit_resistor_ohm: 2670  # E96; DD-33 backup trip for the 4.5 A setpoint. Was 2.52k.
  resistor_tolerance_fraction: 0.001  # PROCUREMENT REQUIREMENT; exact MPN OPEN.
  resistor_tcr_fraction_per_c: 0.000025  # PROCUREMENT REQUIREMENT.
  limit_source_a: 0.000020
  limit_source_a_min: 0.00001985
  limit_source_a_max: 0.00002015
  noise_adjustment_v: 0.000500
  compensated_offset_v_abs_max: 0.000650  # Conservative +/- envelope, fast mode.
  offset_drift_v_per_c_max: 0.0000005
  cmrr_db_min: 100
  psrr_v_per_v_max: 0.000150
  propagation_s_typ: 0.000010  # Typical detector setting, NOT total shutdown time.
  propagation_s_guaranteed_max: UNKNOWN
  latch: HIGH
  delay: FLOAT
  hysteresis: FLOAT
  enable: VCTRL  # Hard enabled; not controlled by firmware.
  resistor_mpn: UNKNOWN

voltage_monitor:  # BUD-18, SNVSAV2B pp.3,5-6.
  mpn: TLV6700DDCR
  source: BUD-18
  rising_threshold_v: 0.400
  rising_threshold_v_min: 0.396
  rising_threshold_v_max: 0.404
  falling_threshold_v: 0.3945
  falling_threshold_v_min: 0.387
  falling_threshold_v_max: 0.400
  uv_top_ohm: 130000  # DD-31: hardware backstop below the loaded 6.0 V operating floor (was 147k).
  uv_bottom_ohm: 10000
  ov_top_ohm: 134000
  ov_bottom_ohm: 10000
  resistor_tolerance_fraction: 0.001  # PROCUREMENT REQUIREMENT.
  resistor_tcr_fraction_per_c: 0.000025  # PROCUREMENT REQUIREMENT.
  uv_input_bias_a_abs_max: 0.000000025
  ov_input_bias_a_abs_max: 0.000000015
  ov_sense_net: VBUCK  # Before shunt/disconnect; catches open load while isolated.
  uv_sense_net: VBAT_PROTECTED
  guaranteed_delay_s_max: UNKNOWN  # Datasheet timing table gives typical values.

control:  # BUD-19/20/21 + PREORDER-08; complete interface still under design.
  supply_mpn: MCP1703AT-3302E/MB
  supply_source: BUD-21
  supply_v: 3.3
  supply_regulation_fraction_full_temp: 0.03
  supply_line_fraction_per_v_max: 0.003
  supply_load_fraction_max: 0.025
  supply_line_test_v: 4.2  # Conservative analysis anchor; not a measured input.
  design_current_a: 0.010  # ASSUMPTION, to be replaced by complete load budget.
  output_cap_f: 0.0000047  # Candidate nominal; effective 1...22 uF required.
  latch_mpn: SN74HCS74DR  # Schmitt inputs; do not silently substitute LVC74A.
  latch_source: BUD-19
  supervisor_mpn: TLV803EA29DBZR
  supervisor_source: BUD-20
  supervisor_threshold_v: 2.93
  supervisor_delay_s: 0.200
  mcu_mpn: ATTINY1616-SN
  mcu_source: PREORDER-08
  mcu_clock_hz: 10000000  # Candidate; fuse/HAL/target checks not implemented.
  complete_enable_buffer: UNKNOWN  # HCS74 drive guarantee at 3.3 V needs proof.

disconnect:
  # DD-31: one P-FET, source at VBUCK, gate pulled to ground when on. Its body diode blocks VBUCK -> laser;
  # a second back-to-back FET would only block laser -> VBUCK, which a passive diode load cannot drive,
  # and adds no forward-blocking redundancy. Resistances are 25 C datasheet values (no interpolation).
  topology: single_pmos_source_at_vbuck
  reverse:  # Input reverse-polarity P-FET, gate grounded: |Vgs| = VBAT_PROTECTED.
    mpn: DMP2022LSS-13
    source: BUD-15
    package: SO-8
    r_ohm_typ_at_4p5v_25c: 0.011
    r_ohm_max_at_4p5v_25c: 0.016
    r_ohm_typ_at_2p5v_25c: 0.017
    r_ohm_max_at_2p5v_25c: 0.022
    gate_rating_v_abs: 12
  candidates:
    - mpn: DMP2022LSS-13
      source: BUD-15
      package: SO-8
      r_ohm_typ_at_4p5v_25c: 0.011
      r_ohm_max_at_4p5v_25c: 0.016
      r_ohm_typ_at_2p5v_25c: 0.017
      r_ohm_max_at_2p5v_25c: 0.022
      vth_v_min_abs: 0.6  # p.2, VGS(th) -0.6...-1.1 V
      gate_rating_v_abs: 12
      qg_c_typ_at_4p5v: 0.0000000281
    - mpn: SISS23DN-T1-GE3  # Same part as A/B Q1; UK stocked (UK-03/UK-32). PREORDER-02 p.1-2, TJ 25 C.
      source: PREORDER-02
      package: PowerPAK1212-8
      r_ohm_typ_at_4p5v_25c: 0.0035
      r_ohm_max_at_4p5v_25c: 0.0045
      r_ohm_typ_at_2p5v_25c: 0.0051
      r_ohm_max_at_2p5v_25c: 0.0063
      vth_v_min_abs: 0.4  # VGS(th) -0.4...-0.9 V
      gate_rating_v_abs: 8  # Needs the gate clamp below for the 8.4 V switch-short case.
  # DD-34: DMP2005UFG-7 (DD-31) dropped, 40-week distributor lead time. SiSS23DN shares the A/B
  # PowerPAK 1212-8 land, so the open FP-POWERPAK footprint review applies here too.
  selected_output_mpn: SISS23DN-T1-GE3
  driver_candidate: AO3400A
  driver_source: BUD-17
  driver_r_guaranteed_gate_v_min: 2.5
  gate_pullup_ohm: 2200  # Source to gate. Candidate only; total turn-off remains unbounded.
  gate_series_ohm: 100  # Gate to the N1/N2 pull-down; limits clamp current (~25 mA at 8.4 V). |Vgs| = 0.957 x source.
  r_hot_multiplier_sensitivity: 1.6  # ASSUMPTION; not a manufacturer maximum.
  gate_clamp_mpn: BZX585-C6V2  # PREORDER-11: VZ 5.89-6.51 V, 300 mW, SOD-523; zener source to gate.
  gate_clamp_vz_v_min: 5.89
  gate_clamp_vz_v_max: 6.51
  total_shutdown_s_guaranteed_max: UNKNOWN

output_energy:
  bulk_cap_f_nominal: 0.000100  # Proposed upstream of disconnect; exact BOM OPEN.
  bulk_cap_f_min_analysis: 0.000050
  bulk_cap_f_max_analysis: 0.000220
  bulk_cap_effective_verified: UNKNOWN
  bulk_cap_voltage_rating_v_required: 16  # Include buck switch-short/8.4 V fault.
  laser_side_cap_f: 0.000000100  # Proposed; connector/cable/diode capacitance OPEN.
  bleeder_ohm: 1000
  bleeder_tolerance_fraction: 0.01
  discharge_to_v: 0.5  # Test criterion after fault, not an emission threshold.
  laser_reconnect_max_current_a: 4.4
  laser_reconnect_peak_verified: UNKNOWN
  bulk_cap_mpn: UNKNOWN

interface:  # DD-32 default-off interface proposal; margins computed by automation/budget/interface.py.
  # nFAULT: wired-AND fault line = HCS74 CLR. Pull-up from VCTRL is split around the external interlock
  # loop (1.0k on the VCTRL side, 9.1k on the nFAULT side); an open loop lets the pulldown clear the latch.
  fault_pullup_ohm: 10100
  interlock_loop_ohm_max: 100  # ALLOCATION: external contacts and cable.
  fault_pulldown_ohm: 47000
  # Open-drain sources. Low level: VOL at its test current scaled linearly to the actual sink current
  # (ASSUMPTION: output transistor in its triode region), or a switch resistance.
  fault_sinks:
    - {part: TLV6700 OUTA/OUTB, source: BUD-18 p.5, vol_v: 0.250, at_a: 0.003, leak_a_max: 0.0000003, count: 2}
    - {part: TLV803EA29 RESET, source: BUD-20 p.8 (VDD 1.7 V row), vol_v: 0.300, at_a: 0.0005, leak_a_max: 0.00000035, count: 1}
    - {part: INA300 ALERT, source: BUD-06 p.5, vol_v: 0.400, at_a: 0.003, leak_a_max: 0.000001, count: 1}
    - {part: DMG1012T inhibit N5, source: LEAD-04 p.2, r_ohm_max: 0.7, leak_a_max: 0.0000001, count: 1}
  fault_loads:  # Inputs on nFAULT; their leakage may flow either way.
    - {part: SN74HCS74 CLR, source: BUD-19 p.5 (6 V), leak_a_max: 0.000001, count: 1}
    - {part: ATTINY1616 monitor pin, source: PREORDER-08 p.513 (typical < 0.05 uA only; ASSUMPTION), leak_a_max: 0.000001, count: 1}
    - {part: DMG1012T gates N2/N4, source: LEAD-04 p.2, leak_a_max: 0.000001, count: 2}
  fault_leak_out_a_allocation: 0.000010  # ALLOCATION >= datasheet sum; 25 C limits, hot leakage UNKNOWN.
  fault_leak_in_a_allocation: 0.000005
  # SN74HCS74 latch (BUD-19 p.4-5). Thresholds are given at VCC 2/4.5/6 V only.
  latch_vcc_min_v: 2.0
  latch_vo_delta_v: 0.1  # VOH >= VCC - 0.1 V, VOL <= 0.1 V at |IO| = 20 uA, VCC 2-6 V.
  latch_io_a_max: 0.000020
  latch_vt_vcc_v: [2.0, 4.5, 6.0]
  latch_vt_pos_v_max: [1.5, 3.15, 4.2]
  latch_vt_neg_v_min: [0.3, 0.9, 1.2]  # ASSUMPTION: linear between rows at 3.1-3.5 V.
  logic_margin_v: 0.1  # ALLOCATION
  # N1-N5: DMG1012T-7 N-MOSFET (LEAD-04 p.2, 25 C). N1/N2 in series pull the output P-FET gate
  # (ARM_Q AND nFAULT); N3/N4 likewise pull the P1 gate; N5 is the firmware-permit inhibit.
  nmos_mpn: DMG1012T-7
  nmos_vth_v_min: 0.5
  nmos_vgs_for_r_v: 1.8
  nmos_r_ohm_max: 0.7
  nmos_idss_a_max: 0.0000001
  nmos_igss_a_max: 0.000001
  nmos_vds_rating_v: 20
  nmos_gate_rating_v: 6
  nmos_gate_series_ohm: 10000  # ARM_Q -> N1 and N3 gates
  nmos_gate_pulldown_ohm: 1000000
  latch_driven_gates: 2
  switch_leak_a_allocation: 0.000010  # ALLOCATION per series pair, off state.
  # P1: DMG1013T-7 P-MOSFET (BUD-23 p.3, 25 C) sources EN from VCTRL through the EN divider.
  pmos_mpn: DMG1013T-7
  pmos_vth_v_min_abs: 0.5
  pmos_vgs_for_r_v: 2.5
  pmos_r_ohm_max: 0.9
  pmos_igss_a_max: 0.000002
  pmos_gate_rating_v: 6
  pmos_gate_pullup_ohm: 10000
  en_series_ohm: 10000
  en_pulldown_ohm: 10000
  en_margin_v: 0.10  # ALLOCATION
  en_pullup_factor_min: 10  # REQUIREMENT: default-off tolerates 10x the typical-only EN pull-up.
  # TLV803EA29 supervisor (BUD-20 p.8-9), on VCTRL, open drain onto nFAULT.
  supervisor_accuracy_fraction: 0.02  # TA -40...125 C
  supervisor_hysteresis_fraction_max: 0.015
  supervisor_vdd_min_v: 1.7  # Lowest VDD with a specified VOL row.
  supervisor_delay_s_min: 0.130
  supervisor_delay_s_max: 0.270
  supervisor_margin_v: 0.03  # ALLOCATION
  # ATTINY1616 (PREORDER-08 p.2 speed grade, p.513 I/O). Firmware permit pin drives the N5 gate.
  mcu_vdd_min_at_clock_v: 2.7  # 0-10 MHz at 2.7-5.5 V
  mcu_vih_fraction: 0.7
  mcu_vil_fraction: 0.3
  mcu_vol_v: 0.6  # VDD 3.0 V, IOL 7.5 mA
  mcu_voh_drop_v: 0.6  # VOH >= 2.4 V at VDD 3.0 V, IOH 7.5 mA
  mcu_drive_test_a: 0.0075
  mcu_pin_leak_a_assumed: 0.000001  # ASSUMPTION: typical < 0.05 uA only.
  inhibit_gate_pullup_ohm: 100000  # N5 defaults ON (inhibit) while the MCU is reset or its pin tristates.
  # Back-power: with VCTRL unpowered, any pin current from VBAT/VBUCK networks lands in this bleed.
  vctrl_bleed_ohm: 15000
  backpower_injection_a_allocation: 0.000020  # ALLOCATION for all VBAT/VBUCK-referenced pins.

power_model:  # automation/budget/power.py. ALLOCATIONs are limits the BOM/layout must meet at temperature.
  input_path_ohm_allocation: 0.015  # ALLOCATION: connector + fuse (hot) + copper up to the reverse FET.
  output_copper_ohm_allocation: 0.003  # ALLOCATION: board copper VBUCK -> output terminals, excl. shunt/FET.
  laser_wiring_ohm: 0.010  # ESTIMATE: off-board leads, same as A/B laser.wiring_resistance_ohm.
  copper_hot_factor: 1.2  # Copper resistance at ~50 K rise (0.39 %/K); applied to the 25 C inductor DCR.
  connector_contact_ohm_each: 0.0008  # BUD-26 XT30PW-M catalogue contact resistance; J1 carries two contacts.
  dropout_margin_v_allocation: 0.10  # ALLOCATION: BOOT refresh, ripple, pack transient below 6.0 V.
  uv_margin_v_allocation: 0.10  # ALLOCATION: residual ripple/transient at the filtered UV sense node.
  ov_margin_v_allocation: 0.10  # ALLOCATION: overshoot above the highest normal VBUCK before OVP.

pcb:  # DD-38 board (hardware/budget-2s). Stack-up for automation/budget/layout_review.py only.
  layers: 4
  board_thickness_mm: 1.6
  copper_oz: 1.0  # Ordering note: 1 oz on all four layers; finished thickness UNKNOWN until the fab confirms.
  prepreg_mm: 0.1855  # ASSUMPTION: same standard 4-layer example as the A/B stack-up (DD-14); fab stack UNKNOWN.
  via_plating_um: 20  # ASSUMPTION (copper.py default); fabricator barrel plating UNKNOWN.

estimates:  # ESTIMATE, efficiency only; not datasheet limits. Bench efficiency is the evidence of record.
  buck_transition_s: 0.000000004  # Per edge, integrated stage; same assumption as the A/B model.
  buck_dead_time_s: 0.000000020
  body_diode_v: 0.7
  buck_gate_drive_w: 0.02
  inductor_core_loss_w: 0.05  # Bourns gives no core-loss data (inductor.core_loss_w stays UNKNOWN).
  # Consistency check of the converter terms against BUD-01 p.1 "Efficiency, VOUT = 3.3 V, FSW = 480 kHz".
  crosscheck_vin_v: 8.0
  crosscheck_vout_v: 3.3
  crosscheck_i_a: 4.0
  crosscheck_typical_curve_read: 0.955  # APPROXIMATE graph read (VIN = 8 V curve, +/-0.5 points); typical, not a limit.

loop:
  # ANALYSIS CANDIDATE ONLY. No installed part or complete switching model.
  compensation_r_ohm: 180
  compensation_c_f: 0.000001
  compensation_hf_c_f: 0.0000000047
  output_cap_f_sweep: [0.000050, 0.000100, 0.000220]  # ASSUMPTION, effective C.
  load_incremental_ohm_sweep: [0.08, 0.20, 0.35]  # ASSUMPTION, not measured laser Rd.
  load_incremental_ohm_nominal: 0.20  # ASSUMPTION, nominal AC comparison.
  error_amplifier_gm_factors: [0.7, 1.0, 1.3]  # Sensitivity, not guaranteed tolerance.
  modulator_gm_factors: [0.7, 1.0, 1.3]  # Sensitivity, not guaranteed tolerance.
  sensor_bandwidth_hz_sweep: [20000, 37000, 60000]  # Sensitivity; only 37 kHz typical sourced.
  inner_pole_fraction_of_fsw: 0.1  # ASSUMPTION; actual inner dynamics UNKNOWN.
  error_amplifier_dc_gain_min: 1000  # BUD-01 p.5, sets finite EA output resistance.
  sweep_frequency_hz_min: 1
  sweep_frequency_hz_max: 2000000
  sweep_frequency_points: 6000
  ngspice_points_per_decade: 100
  ngspice_agreement_relative_tolerance: 0.00001
  minimum_phase_margin_deg: 45
  minimum_gain_margin_db: 10
  verified_model: UNKNOWN

procurement:
  currency: GBP
  working_quantities: [3, 5]
  development_spares_per_unique_mpn: 2  # Not PCBWay's accepted attrition allowance.
  quoted_component_total_gbp: UNKNOWN
  quoted_fab_assembly_landed_gbp: UNKNOWN
  pack_bms_charger_mpn: UNKNOWN
  assembly_quantity_three_accepted: UNKNOWN
