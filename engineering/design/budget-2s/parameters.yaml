  falling_threshold_v: 0.3945
  falling_threshold_v_min: 0.387
  falling_threshold_v_max: 0.400
  uv_top_ohm: 147000
  uv_bottom_ohm: 10000
  ov_top_ohm: 134000
  ov_bottom_ohm: 10000
