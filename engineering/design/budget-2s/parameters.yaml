# Authoritative numeric inputs for BUDGET-2S engineering development (DD-30).
# These are candidate design values and source limits, NOT an approved circuit.
# UNKNOWN is intentional. Do not promote an assumption to a guaranteed limit.
schema: nubm44-budget-parameters.v1
meta:
  revision: B0-feasibility
  date: '2026-10-29'
  status: ELECTRICAL_QUALIFICATION
  decision: DD-30
  variant: budget-2s

targets:  # Owner brief / REQ-BUD-01...09; proposed voltage/efficiency details.
  current_a: 4.0
  accuracy_fraction: 0.05
  normal_peak_a: 4.4
  laser_v_min: 3.8
  laser_v_typ: 4.5  # Analysis test point, not measured NUBM44 forward voltage.
  laser_v_max: 5.2
  board_c_min: 0
  board_c_max: 50
  input_v_min: 6.0  # Proposed connector voltage; dropout remains OPEN.
  input_v_nominal: 7.4
  input_v_max: 8.4
  efficiency_fraction: 0.94  # Proposed at 7.4 V/4 A; report ALL three Vf points.
  backup_trip_a_min: 4.8  # Proposed qualification window, not normal peak limit.
  backup_trip_a_max: 5.2
  board_thermal_trip_c: 85
  laser_thermal_trip_c: 60
  arming_hold_s: 2.0
  flash_hz: 2.0
  flash_duty: 0.5
  cost_gbp_per_working_driver: 60
  compare_working_quantities: [3, 5]

